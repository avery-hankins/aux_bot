[project]
name = "aux-bot"
version = "0.1.0"
description = "Discord music bot with charts, games, and RYM integration"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6,<3",
    "python-dotenv>=1.2",
    "numpy>=2.4",
    "requests>=2.32",
    "Pillow>=12.1",
    "pandas>=2.2",
    "imageio>=2.37",
    "scipy>=1.17",
    "opencv-python>=4.13",
]

[tool.setuptools]
packages = []
